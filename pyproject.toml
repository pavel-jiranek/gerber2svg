[project]
name = "gerber2svg"
version = "0.1.0"
description = "Convert PCB Gerber copper layers to SVG for laser etching and isolation milling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gerbonara==1.6.3",
    "shapely>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gerber2svg = "gerber2svg.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
